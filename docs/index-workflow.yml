name: Rebuild furniture and emotes index
on:
  push:
    paths: ['furniture/**', 'emotes/**']
    branches: [main]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_index.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add furniture/index.json emotes/index.json
          git diff --cached --quiet || (git commit -m "Update furniture and emotes index" && git push)
